spring:
  application:
    name: clinic-system-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_system}
    username: ${DB_USERNAME:clinic_user}
    password: ${DB_PASSWORD:clinic_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
